name: Validate historical CloudFormation templates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'cfn-lint==1.57.0'
      - run: cfn-lint 001ProdVpc.yaml 002ProdEcsCluster.yaml
